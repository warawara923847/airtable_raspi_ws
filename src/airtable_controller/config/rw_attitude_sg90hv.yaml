# Manual speed levels and yaw-hold PID for the SG90-HV continuous-rotation servo that
# stands in for the ARW-3m (docs/adr/0018). Outputs are normalized wheel speed commands
# in [-1, 1]; the hardware maps them to pulse widths with its own calibration.
# The gains below are starting values only: tune them on the table.
/**:
  ros__parameters:
    rw_name: rw_1
    publish_rate_hz: 50.0
    # measurements/external_pose (ArUco tracking). Leaving PID when older than this.
    pose_topic: measurements/external_pose
    pose_timeout_s: 0.5
    # Limits how fast the command changes (full scale in 0.5 s) to avoid reaction kicks.
    max_speed_rate_per_s: 2.0
    manual:
      # One button press moves one level. Must be ascending and contain 0.
      levels: [-0.5, -0.25, -0.1, 0.0, 0.1, 0.25, 0.5]
    pid:
      # Output per rad of yaw error / per rad s of integral / per rad/s of yaw rate.
      kp: 0.5
      ki: 0.0
      kd: 0.0
      # Bound of |ki * integral| in output units.
      integral_limit: 0.2
      output_limit: 0.5
      # Low-pass on the yaw rate differenced from poses (for kd).
      rate_filter_tau_s: 0.1
      max_dt_s: 0.5
