/**:
  ros__parameters:
    reference_frame: table_1
    body_frame: robot_1/base_link
    state_topic: state/odometry
    start_enabled: false
    control_rate_hz: 50.0
    actual_path_rate_hz: 20.0
    state_timeout_s: 0.25
    trajectory:
      type: line
      amplitude_m: 0.20
      radius_m: 0.20
      # Empty [] preserves the old start-relative circle center.
      circle_center_m: [0.5, 1.0]
      period_s: 30.0
      startup_s: 5.0
      direction_rad: 1.5708
      offset_m: [0.0, 0.0]
      fixed_yaw_rad: 0.0
    # Independent nominal control model; keep in sync with MuJoCo manually.
    model:
      mass_kg: 1.0
      inertia_kg_m2: 0.00666666666667
    gains:
      position_kp: 0.8
      velocity_kd: 1.8
      yaw_kp: 2.0
      yaw_rate_kd: 2.8
    limits:
      acceleration_m_s2: 0.04
      yaw_acceleration_rad_s2: 0.5
      # Center-of-body bounds [xmin, xmax, ymin, ymax] in reference_frame.
      position_bounds_m: [0.15, 0.85, 0.15, 1.85]
    # Valve pulse width. pulse_period_s (omitted: equal to the width, back-to-back pulses
    # possible) is the tick at which each thruster may start one pulse. A longer period
    # leaves slow valves time to close and caps the average thrust at
    # on_thrust_n * width/period; the launch lowers the allocator's max_thrust_n to that
    # (trajectory.launch.py pulse_duration:=0.02 pulse_period:=0.1).
    pulse_duration_s: 0.01
    command_timeout_s: 1.0
