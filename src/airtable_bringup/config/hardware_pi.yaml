# Real I/O of airtable_hardware on Raspberry Pi 5, apart from the reaction wheel.
# Name it in hardware.params of a robot configuration (config/robots/*.yaml), or pass
#   ros2 launch airtable_bringup hardware.launch.py \
#     hardware_params:=package://airtable_bringup/config/hardware_pi.yaml
# Without it every backend is dummy. The wheel is chosen by hardware.rw of the robot
# configuration, whose file (arw3m.yaml / sg90hv.yaml) is layered over this one.
/**:
  ros__parameters:
    thrusters:
      # gpio: Linux GPIO character device. The valves are normally closed; lines are driven
      # low at start, at pulse end and at shutdown.
      backend: gpio
      # Empty: the 40-pin header is found by its chip label (pinctrl-rp1).
      gpio_chip: ""
      # BCM numbers of thruster_1..4 (C sample VALVE1..4). Wiring not verified on hardware.
      gpio_lines: [19, 26, 20, 21]
      # Longest single pulse; a longer command is shortened.
      max_pulse_ms: 1000
