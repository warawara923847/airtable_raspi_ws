# Robot configuration (not a ROS parameter file): two tables, one robot on each.
# Each robot follows its own trajectory in its own table frame; no formation control.
# Schema, path rules and override precedence: airtable_bringup/robot_config.py and
# docs/adr/0014-multi-robot-configuration.md.
version: 1
description: table_1/robot_1 and table_2/robot_2, independent fixed-yaw tracking.
simulation:
  # Simulation-only placement: table origins 5 m apart along world +X (the tables'
  # short side), one fixed camera per table. Not a real calibration.
  model: package://airtable_sim/mujoco/airtable_dual.xml
tables:
  # Real world -> table placement [x_m, y_m, yaw_rad] for RViz/recording only.
  # Uncalibrated tables stay null; no world TF is published for them on hardware.
  table_1:
    world_pose: null
  table_2:
    world_pose: null
defaults:
  # Shared nominal model/gains/thrusters. Copy a file and point one robot at it to
  # give that robot different measured values.
  trajectory_params: package://airtable_controller/config/trajectory.yaml
  thruster_params: package://airtable_controller/config/thrusters.yaml
robots:
  - namespace: robot_1
    table_frame: table_1
    state_topic: state/odometry
    trajectory_overrides:
      trajectory:
        type: line
    simulation:
      element_prefix: robot_1/
      initial_pose: null
    tracking:
      params: package://airtable_tracking/config/tracking.yaml
      # tracking:=true in simulation: table_1's camera, cards 10-13, robot card 50.
      simulation_params: package://airtable_tracking/config/simulation_tracking.yaml
      simulation_camera: table_1/tracking_camera
      camera_frame: camera_infra1_optical_frame
      image_topic: /camera/camera/infra1/image_rect_raw
      camera_info_topic: /camera/camera/infra1/camera_info
      marker_size: 0.1
      camera_serial_no: null  # not recorded yet
    hardware:
      params: null
      imu_frame: robot_1/imu_link
      imu_mount: null  # not measured
  - namespace: robot_2
    table_frame: table_2
    state_topic: state/odometry
    trajectory_overrides:
      trajectory:
        type: circle
    simulation:
      element_prefix: robot_2/
      initial_pose: null  # circle edge: center + offset + [radius, 0]
    tracking:
      # Real camera not configured yet: needs table_2 marker IDs/centers, robot_2
      # marker ID and mount, and the camera serial/topics. Copy tracking.yaml with
      # table_frame: table_2; IDs different from table_1 (the simulation uses
      # 20-23 and 51) make a camera/table mix-up fail calibration.
      params: null
      # tracking:=true in simulation: table_2's camera, cards 20-23, robot card 51.
      simulation_params: package://airtable_tracking/config/simulation_tracking_robot_2.yaml
      simulation_camera: table_2/tracking_camera
      camera_frame: null
      image_topic: null
      camera_info_topic: null
      marker_size: null
      camera_serial_no: null
    hardware:
      params: null
      imu_frame: robot_2/imu_link
      imu_mount: null  # not measured
