# Robot configuration (not a ROS parameter file) for the existing one-table setup.
# Schema, path rules and override precedence: airtable_bringup/robot_config.py and
# docs/adr/0014-multi-robot-configuration.md.
version: 1
description: One table and robot_1, using the original MJCF names.
simulation:
  model: package://airtable_sim/mujoco/airtable.xml
tables:
  table_1:
    # Real world -> table_1 placement [x_m, y_m, yaw_rad]. null: not calibrated, no TF.
    world_pose: null
    # Parallel light, as seen from the table: azimuth from +X (counterclockwise) and elevation
    # [deg]. 180, 0: the light is on the table's -X side and shines along +X.
    sun: {azimuth_deg: 180.0, elevation_deg: 0.0}
defaults:
  trajectory_params: package://airtable_controller/config/trajectory.yaml
  thruster_params: package://airtable_controller/config/thrusters.yaml
robots:
  - namespace: robot_1
    table_frame: table_1
    # Real/estimator Odometry input, relative to the namespace.
    state_topic: state/odometry
    simulation:
      # airtable.xml keeps unprefixed actuator/sensor names (thruster_1_actuator, ...).
      element_prefix: ''
      # [x_m, y_m, yaw_rad] in table_1. null: circle edge for circles, else MJCF default.
      initial_pose: null
    tracking:
      params: package://airtable_tracking/config/tracking.yaml
      # Used by tracking:=true in simulation; requires the camera in airtable.xml.
      simulation_params: package://airtable_tracking/config/simulation_tracking.yaml
      # MJCF camera; tracking_camera keeps /sim/camera/infra1/* topics.
      simulation_camera: tracking_camera
      camera_frame: camera_infra1_optical_frame
      image_topic: /camera/camera/infra1/image_rect_raw
      camera_info_topic: /camera/camera/infra1/camera_info
      marker_size: 0.1
      camera_serial_no: null  # not recorded yet
    hardware:
      # Valves stay dummy until their wiring is verified; hardware_pi.yaml enables GPIO.
      params: null
      # Reaction wheel on the real robot: none | arw3m | sg90hv (stand-in until the
      # ARW-3m works). Picks the Pi's wheel parameters and the PC's manual RW control.
      rw: sg90hv
      # Default keeps the legacy single-robot frame.
      imu_frame: imu_link
      imu_mount: null  # base_link -> IMU [x,y,z,roll,pitch,yaw]; not measured
    # nanoSSOC-D60, shared by the real robot and the simulator (docs/sun-sensor.md).
    # Remove this block if the sensor is not fitted.
    sun_sensor:
      # base_link -> sensor [x,y,z,roll,pitch,yaw] (m, rad). On the right side: sensor +Z
      # toward body -Y, +X toward body +X. The position is provisional (body edge).
      mount: [0.0, -0.08, 0.0, 1.5707963267948966, 0.0, 0.0]
