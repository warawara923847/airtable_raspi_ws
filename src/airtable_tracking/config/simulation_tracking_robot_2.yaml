# Simulated table_2/robot_2 in airtable_sim/mujoco/airtable_dual.xml (and
# airtable_robot_2.xml). Same card layout as simulation_tracking.yaml, but with
# table_2's own IDs so a camera/table mix-up fails calibration.
/**:
  ros__parameters:
    # Replaced by the launch with the camera's frame (sim_table_2_camera_...).
    camera_frame: sim_table_2_camera_infra1_optical_frame
    table_frame: table_2
    fixed_marker_ids: [20, 21, 22, 23]
    moving_marker_id: 51
    # Centers of the printed top faces in table_2 [m].
    fixed_marker_positions: [0.12, 0.12, 0.002,
                             0.88, 0.12, 0.002,
                             0.12, 1.88, 0.002,
                             0.88, 1.88, 0.002]
    base_to_marker_translation: [0.0, 0.0, 0.147]
    base_to_marker_rpy: [0.0, 0.0, 0.0]
    base_height: 0.01
    calibration_max_time_span: 0.15
    calibration_max_residual: 0.02
    pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]
